<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0a1f">
<title>Countdown</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Countdown">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700;800&display=swap">
<style>
  [hidden] { display: none !important; }
  /* Fill the whole iPhone screen, including under the notch and home bar */
  html { height: 100%; min-height: 100vh; min-height: 100lvh; background: #0b0a1f; }
  html:has(body[data-app="glass"]) { background: linear-gradient(180deg, #2a1667 0%, #1a1450 55%, #1e2a7a 100%); }
  html:has(body[data-app="dark"]) { background: #000000; }
  html:has(body[data-app="white"]) { background: #f4f5f8; }
  html:has(body[data-app="crimson"]) { background: linear-gradient(180deg, #4a0717 0%, #22030b 55%, #3a0612 100%); }
  html:has(body[data-app="cloudy"]) { background: linear-gradient(180deg, #5b626c 0%, #40464f 55%, #30353c 100%); }
  html:has(body[data-app="aura"]) { background: linear-gradient(180deg, #06204f 0%, #030f2b 55%, #053656 100%); }
  /* Layout: one full screen, giant day count centered, gear top-right, settings sheet slides up */
  :root {
    --font: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body[data-app="glass"] {
    --bg: #0b0a1f; --fg: #ffffff; --muted: rgba(255,255,255,.62);
    --panel: rgba(255,255,255,.10); --border: rgba(255,255,255,.22);
    --track: rgba(255,255,255,.16); --accent: #a78bfa; --accent2: #60a5fa;
    --sheet: rgba(30,24,64,.72); --scrim: rgba(5,4,18,.45); --on: #8b5cf6;
    color-scheme: dark;
  }
  body[data-app="crimson"] {
    --bg: #1a030a; --fg: #ffffff; --muted: rgba(255,228,232,.66);
    --panel: rgba(255,255,255,.09); --border: rgba(255,190,200,.24);
    --track: rgba(255,255,255,.15); --accent: #fb7185; --accent2: #e11d48;
    --sheet: rgba(58,8,22,.74); --scrim: rgba(20,2,8,.5); --on: #dc143c;
    --b1: #be123c; --b2: #7f1d1d; --b3: #f43f5e; --o1: .6; --o2: .6; --o3: .3;
    --digits: #fecdd3;
    color-scheme: dark;
  }
  body[data-app="cloudy"] {
    --bg: #3a3f47; --fg: #ffffff; --muted: rgba(255,255,255,.72);
    --panel: rgba(255,255,255,.13); --border: rgba(255,255,255,.28);
    --track: rgba(255,255,255,.2); --accent: #e5e7eb; --accent2: #9ca3af;
    --sheet: rgba(64,70,79,.78); --scrim: rgba(20,22,26,.45); --on: #64748b;
    --b1: #c3c9d1; --b2: #8a929c; --b3: #e5e8ec; --o1: .45; --o2: .5; --o3: .3;
    --blur: 90px; --digits: #e2e8f0;
    color-scheme: dark;
  }
  body[data-app="aura"] {
    --bg: #020b22; --fg: #ffffff; --muted: rgba(224,242,254,.68);
    --panel: rgba(255,255,255,.09); --border: rgba(186,230,253,.26);
    --track: rgba(255,255,255,.15); --accent: #38bdf8; --accent2: #22d3ee;
    --sheet: rgba(8,24,56,.74); --scrim: rgba(2,8,24,.5); --on: #0ea5e9;
    --b1: #2563eb; --b2: #0ea5e9; --b3: #22d3ee; --o1: .6; --o2: .55; --o3: .35;
    --digits: #bae6fd;
    color-scheme: dark;
  }
  body[data-app="dark"] {
    --bg: #000000; --fg: #f4f4f5; --muted: #8e8e96;
    --panel: #141416; --border: #26262b;
    --track: #222226; --accent: #e4e4e7; --accent2: #a1a1aa;
    --sheet: #111113; --scrim: rgba(0,0,0,.6); --on: #f4f4f5;
    color-scheme: dark;
  }
  body[data-app="white"] {
    --bg: #f4f5f8; --fg: #15161a; --muted: #6b6f7a;
    --panel: #ffffff; --border: #e3e5ea;
    --track: #e3e5ea; --accent: #4f46e5; --accent2: #0ea5e9;
    --sheet: #ffffff; --scrim: rgba(20,22,30,.28); --on: #4f46e5;
    color-scheme: light;
  }
  body {
    min-height: 100vh; min-height: 100lvh;
    background: var(--bg); color: var(--fg); font-family: var(--font);
    margin: 0; overflow-x: hidden; position: relative;
    transition: background-color .4s ease, color .4s ease;
    -webkit-tap-highlight-color: transparent;
  }
  /* glow blobs (Glass, Crimson, Grey Cloudy, Blue Aura) */
  .nebula { position: fixed; top: -30vh; bottom: -30vh; left: 0; right: 0; pointer-events: none; opacity: 0; transition: opacity .5s ease; overflow: hidden; }
  body:is([data-app="glass"],[data-app="crimson"],[data-app="cloudy"],[data-app="aura"]) .nebula { opacity: 1; }
  .nebula span { position: absolute; border-radius: 50%; filter: blur(var(--blur, 70px)); transition: background-color .6s ease, opacity .6s ease; animation: drift 18s ease-in-out infinite alternate; }
  .nebula .b1 { width: 70vmax; height: 70vmax; left: -25vmax; top: -20vmax; background: var(--b1, #6d28d9); opacity: var(--o1, .55); }
  .nebula .b2 { width: 60vmax; height: 60vmax; right: -25vmax; bottom: -15vmax; background: var(--b2, #1d4ed8); opacity: var(--o2, .5); animation-duration: 22s; animation-direction: alternate-reverse; }
  .nebula .b3 { width: 35vmax; height: 35vmax; left: 40%; top: 45%; background: var(--b3, #db2777); opacity: var(--o3, .28); animation-duration: 26s; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(4vmax, 3vmax) scale(1.08); } }

  .app {
    position: relative; min-height: 100vh; min-height: 100svh; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: calc(env(safe-area-inset-top, 0px) + 64px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
    text-align: center;
    animation: fadeIn .7s ease both;
  }
  .scroll-hint { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .scroll-hint svg { width: 18px; height: 18px; animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(4px); } }

  /* Homework section */
  .hw {
    position: relative; box-sizing: border-box; max-width: 560px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: 24px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
  }
  .hw-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .hw-head h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .hw-sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .pill-btn { flex: none; border: 1px solid var(--border); background: var(--panel); color: var(--fg); font: inherit; font-size: 14px; font-weight: 500; padding: 10px 16px; min-height: 44px; border-radius: 99px; cursor: pointer; transition: transform .15s ease; display: inline-flex; align-items: center; gap: 8px; }
  .pill-btn svg { width: 16px; height: 16px; }
  a.pill-btn { text-decoration: none; margin-top: 14px; }
  .pill-btn.primary { background: var(--on); border-color: transparent; color: #fff; }
  body[data-app="dark"] .pill-btn.primary { color: #000; }
  .hw-list { display: flex; flex-direction: column; gap: 10px; }
  .hw-card { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--border); color: var(--fg); text-decoration: none; transition: transform .15s ease; }
  .hw-card:active { transform: scale(.98); }
  body:is([data-app="glass"],[data-app="crimson"],[data-app="cloudy"],[data-app="aura"]) :is(.hw-card, .pill-btn:not(.primary), .hw-empty) { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .hw-stripe { flex: none; width: 4px; align-self: stretch; border-radius: 4px; background: var(--track); }
  .hw-card.soon .hw-stripe { background: #f59e0b; }
  .hw-card.missing .hw-stripe { background: #ef4444; }
  .hw-body { flex: 1; min-width: 0; }
  .hw-title { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
  .hw-course { margin: 3px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .hw-due { margin: 8px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; }
  .chip.soon { background: rgba(245,158,11,.2); color: #fbbf24; }
  .chip.missing { background: rgba(239,68,68,.2); color: #f87171; }
  body[data-app="white"] .chip.soon { color: #b45309; }
  body[data-app="white"] .chip.missing { color: #b91c1c; }
  .hw-empty { padding: 22px 18px; border-radius: 16px; background: var(--panel); border: 1px dashed var(--border); font-size: 14px; line-height: 1.55; color: var(--muted); }
  .hw-empty strong { color: var(--fg); font-weight: 500; }
  .hw-empty .pill-btn { margin-top: 14px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .school { font-size: 12px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px; }
  .days { font-size: clamp(96px, 32vw, 160px); font-weight: 800; line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin: 0; }
  body:is([data-app="glass"],[data-app="crimson"],[data-app="cloudy"],[data-app="aura"]) .days { background: linear-gradient(180deg, #fff 30%, var(--digits, #c4b5fd)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .label { font-size: 20px; font-weight: 300; margin: 6px 0 22px; }
  .clock {
    font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums;
    padding: 10px 20px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border);
    margin-bottom: 24px;
  }
  body:is([data-app="glass"],[data-app="crimson"],[data-app="cloudy"],[data-app="aura"]) .clock { backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .clock .u { font-size: .65em; color: var(--muted); margin-left: 1px; margin-right: 8px; }
  .clock .u:last-child { margin-right: 0; }
  .lastday { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .progress { display: flex; align-items: center; gap: 10px; width: min(280px, 100%); }
  .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0; transition: width .6s ease; }
  .pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .gear {
    position: fixed; z-index: 5;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel); color: var(--fg); display: grid; place-items: center; cursor: pointer;
    transition: transform .15s ease;
  }
  body:is([data-app="glass"],[data-app="crimson"],[data-app="cloudy"],[data-app="aura"]) .gear { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .gear svg { width: 24px; height: 24px; transition: transform .5s ease; }
  .gear.spin svg { transform: rotate(90deg); }
  button:active, .switch-row:active .sw, .theme-card:active { transform: scale(.95); }
  button:focus-visible, .theme-card:focus-visible, input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 3px; }

  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 8; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    max-height: 85%; overflow-y: auto; box-sizing: border-box;
    background: var(--sheet); color: var(--fg); border-top: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 -10px 40px rgba(0,0,0,.25);
  }
  body:is([data-app="glass"],[data-app="crimson"],[data-app="cloudy"],[data-app="aura"]) .sheet { backdrop-filter: blur(28px) saturate(1.3); -webkit-backdrop-filter: blur(28px) saturate(1.3); }
  .sheet.open { transform: none; }
  .grabber { width: 40px; height: 5px; border-radius: 99px; background: var(--track); margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-head h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .close { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--panel); color: var(--fg); display: grid; place-items: center; cursor: pointer; transition: transform .15s ease; }
  .close svg { width: 18px; height: 18px; }
  .section-title { font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .group { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; cursor: pointer; font-size: 16px; }
  .switch-row + .switch-row { border-top: 1px solid var(--border); }
  .switch-row input { position: absolute; opacity: 0; pointer-events: none; }
  .sw { width: 51px; height: 31px; border-radius: 99px; background: var(--track); position: relative; flex: none; transition: background .25s ease, transform .15s ease; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .25s ease; }
  input:checked + .sw { background: var(--on); }
  body[data-app="dark"] input:checked + .sw::after { background: #000; }
  input:checked + .sw::after { transform: translateX(20px); }

  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .theme-card { border: 0; background: none; padding: 0; color: var(--fg); font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .15s ease; }
  .preview { position: relative; width: 100%; aspect-ratio: 9 / 14; max-width: 100%; border-radius: 14px; overflow: hidden; border: 2px solid var(--border); box-sizing: border-box; display: grid; place-items: center; transition: border-color .25s ease; }
  .theme-card[aria-pressed="true"] .preview { border-color: var(--accent); }
  .preview b { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .preview i { position: absolute; left: 22%; right: 22%; bottom: 22%; height: 9px; border-radius: 4px; }
  .pv-glass { background: radial-gradient(circle at 20% 15%, #6d28d9, transparent 60%), radial-gradient(circle at 85% 85%, #1d4ed8, transparent 60%), #0b0a1f; color: #fff; }
  .pv-glass i { background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.35); }
  .pv-crimson { background: radial-gradient(circle at 20% 15%, #be123c, transparent 60%), radial-gradient(circle at 85% 85%, #7f1d1d, transparent 60%), #1a030a; color: #fff; }
  .pv-crimson i { background: rgba(255,255,255,.2); border: 1px solid rgba(255,190,200,.4); }
  .pv-cloudy { background: radial-gradient(circle at 25% 20%, #c3c9d1, transparent 55%), radial-gradient(circle at 80% 75%, #8a929c, transparent 60%), #3a3f47; color: #fff; }
  .pv-cloudy i { background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.4); }
  .pv-aura { background: radial-gradient(circle at 20% 15%, #2563eb, transparent 60%), radial-gradient(circle at 80% 85%, #22d3ee, transparent 55%), #020b22; color: #fff; }
  .pv-aura i { background: rgba(255,255,255,.2); border: 1px solid rgba(186,230,253,.45); }
  .pv-dark { background: #000; color: #f4f4f5; }
  .pv-dark i { background: #1c1c1f; }
  .pv-white { background: #f4f5f8; color: #15161a; }
  .pv-white i { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .check { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--bg); display: none; place-items: center; }
  body:is([data-app="glass"],[data-app="crimson"],[data-app="cloudy"],[data-app="aura"]) .check { color: #fff; }
  .check svg { width: 12px; height: 12px; }
  .theme-card[aria-pressed="true"] .check { display: grid; }
  .theme-name { font-size: 13px; }
  .note { font-size: 12px; color: var(--muted); margin: 18px 0 0; line-height: 1.5; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="nebula" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

<button class="gear" id="gearBtn" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<main class="app">
  <p class="school">Carlsbad High School</p>
  <p class="days" id="days">0</p>
  <p class="label" id="label">days left</p>
  <div class="clock" id="clock"></div>
  <p class="lastday">Last day: Thursday, June 10, 2027</p>
  <div class="progress"><div class="bar"><div class="fill" id="fill"></div></div><span class="pct" id="pct">0% done</span></div>
  <div class="scroll-hint" aria-hidden="true">Homework<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
</main>

<section class="hw" id="homework" aria-label="Homework">
  <div class="hw-head">
    <div>
      <h2>Homework</h2>
      <p class="hw-sub" id="hwSub">Loading…</p>
    </div>
    <button class="pill-btn" id="hwRefresh" hidden aria-label="Refresh homework">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Refresh
    </button>
  </div>
  <div id="hwBox"></div>
</section>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Settings" aria-hidden="true">
  <div class="grabber"></div>
  <div class="sheet-head">
    <h2>Settings</h2>
    <button class="close" id="closeBtn" aria-label="Close settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <p class="section-title">Clock</p>
  <div class="group">
    <label class="switch-row" for="optH"><span>Show hours</span><input type="checkbox" id="optH"><span class="sw"></span></label>
    <label class="switch-row" for="optM"><span>Show minutes</span><input type="checkbox" id="optM"><span class="sw"></span></label>
    <label class="switch-row" for="optS"><span>Show seconds</span><input type="checkbox" id="optS"><span class="sw"></span></label>
  </div>

  <p class="section-title">Theme</p>
  <div class="themes">
    <button class="theme-card" data-theme-pick="glass" aria-pressed="false">
      <span class="preview pv-glass"><b>223</b><i></i><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
      <span class="theme-name">Glass</span>
    </button>
    <button class="theme-card" data-theme-pick="crimson" aria-pressed="false">
      <span class="preview pv-crimson"><b>223</b><i></i><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
      <span class="theme-name">Crimson</span>
    </button>
    <button class="theme-card" data-theme-pick="cloudy" aria-pressed="false">
      <span class="preview pv-cloudy"><b>223</b><i></i><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
      <span class="theme-name">Grey Cloudy</span>
    </button>
    <button class="theme-card" data-theme-pick="aura" aria-pressed="false">
      <span class="preview pv-aura"><b>223</b><i></i><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
      <span class="theme-name">Blue Aura</span>
    </button>
    <button class="theme-card" data-theme-pick="dark" aria-pressed="false">
      <span class="preview pv-dark"><b>223</b><i></i><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
      <span class="theme-name">Dark Night</span>
    </button>
    <button class="theme-card" data-theme-pick="white" aria-pressed="false">
      <span class="preview pv-white"><b>223</b><i></i><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
      <span class="theme-name">White</span>
    </button>
  </div>
  <p class="note">Counts down to the end of the last day of school, June 10, 2027, California time.<br>App version <span id="ver"></span></p>
</section>

<script>
  // Change these dates for next school year (California time, PDT = UTC-7)
  const FIRST_DAY = Date.parse("2026-08-25T00:00:00-07:00");
  const LAST_DAY_END = Date.parse("2027-06-10T23:59:59-07:00");

  const KEY = "carlsbad-countdown-settings";
  const defaults = { h: true, m: true, s: true, theme: "glass" };
  let settings = { ...defaults };
  try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) settings = { ...defaults, ...saved }; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} }

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  /* ---------- Google Classroom homework ---------- */
  // Paste the Google OAuth Client ID here
  const GOOGLE_CLIENT_ID = ""; // Blocked by school admin (access_not_configured). Saved key: 637315560252-tsdk6avnun1rso0cn93025n6dk19hrid.apps.googleusercontent.com
  const SCOPES = "https://www.googleapis.com/auth/classroom.courses.readonly https://www.googleapis.com/auth/classroom.coursework.me.readonly";
  const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, "");
  const TOKEN_KEY = "carlsbad-classroom-token";

  // Pick up the sign-in result when Google sends you back
  (function readTokenFromUrl() {
    if (!location.hash.includes("access_token=")) return;
    const p = new URLSearchParams(location.hash.slice(1));
    const token = p.get("access_token"), exp = Number(p.get("expires_in") || 3600);
    if (token) { try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token, until: Date.now() + (exp - 60) * 1000 })); } catch (e) {} }
    history.replaceState(null, "", location.pathname);
  })();
  const classroomError = (() => {
    const q = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
    const err = q.get("error");
    if (err) history.replaceState(null, "", location.pathname);
    return err;
  })();

  function getToken() {
    try { const t = JSON.parse(localStorage.getItem(TOKEN_KEY) || "null"); if (t && t.until > Date.now()) return t.token; } catch (e) {}
    return null;
  }
  function wasConnected() { try { return !!localStorage.getItem(TOKEN_KEY); } catch (e) { return false; } }
  function connectClassroom() {
    const url = "https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams({
      client_id: GOOGLE_CLIENT_ID, redirect_uri: REDIRECT_URI, response_type: "token",
      scope: SCOPES, include_granted_scopes: "true", ...(wasConnected() ? {} : { prompt: "consent" })
    });
    location.assign(url);
  }
  const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function hwMessage(html, buttonLabel) {
    $("hwBox").innerHTML = `<div class="hw-empty">${html}${buttonLabel ? `<br><button class="pill-btn primary" id="hwConnect">${buttonLabel}</button>` : ""}</div>`;
    const b = document.getElementById("hwConnect");
    if (b) b.addEventListener("click", connectClassroom);
  }

  async function api(path, token) {
    const res = await fetch("https://classroom.googleapis.com/v1/" + path, { headers: { Authorization: "Bearer " + token } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error((body.error && body.error.message) || ("Error " + res.status)); e.status = res.status; throw e; }
    return body;
  }

  function dueDateOf(w) {
    if (!w.dueDate) return null;
    const d = w.dueDate, t = w.dueTime || {};
    const hasTime = t.hours !== undefined || t.minutes !== undefined;
    return new Date(Date.UTC(d.year, d.month - 1, d.day, hasTime ? (t.hours || 0) : 23, hasTime ? (t.minutes || 0) : 59));
  }
  function relTime(ms) {
    const abs = Math.abs(ms), h = Math.round(abs / 3600000), d = Math.round(abs / 86400000);
    const txt = abs < 3600000 ? Math.max(1, Math.round(abs / 60000)) + " min" : abs < 86400000 * 2 ? h + " h" : d + " days";
    return ms >= 0 ? "in " + txt : txt + " ago";
  }
  const dueFmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

  // Homework comes from your Apps Script robot through a private ntfy channel
  const HW_TOPIC = "chs-hw-8f1a4a4853498b29";
  const TODO_URL = "https://classroom.google.com/u/0/a/not-turned-in/all";
  let hwLoading = false;
  function showTodoFallback(note) {
    $("hwSub").textContent = note || "Your To-do list in Google Classroom";
    $("hwBox").innerHTML = `<div class="hw-empty"><strong>No homework data yet</strong><br>Your homework robot hasn't sent anything in the last 12 hours.<br><a class="pill-btn primary" href="${TODO_URL}" target="_blank" rel="noopener">Open Classroom To-do</a></div>`;
  }
  async function loadHomework() {
    if (hwLoading) return;
    hwLoading = true;
    try {
      const res = await fetch(`https://ntfy.sh/${HW_TOPIC}/json?poll=1&since=all`, { cache: "no-store" });
      const lines = (await res.text()).trim().split("\n").filter(Boolean);
      let data = null;
      for (let i = lines.length - 1; i >= 0 && !data; i--) {
        try { const ev = JSON.parse(lines[i]); if (ev.event === "message" && ev.message) data = JSON.parse(ev.message); } catch (e) {}
      }
      if (!data) { showTodoFallback(); return; }
      const now = Date.now();
      const items = (data.h || []).map(i => ({ title: i.t, course: i.c, due: new Date(i.d), diff: i.d - now, link: "https://classroom.google.com" + (i.l || "") }));
      const mins = Math.max(0, Math.round((now - data.u) / 60000));
      $("hwSub").textContent = `From Google Classroom · updated ${mins < 1 ? "just now" : mins + " min ago"}`;
      $("hwRefresh").hidden = false;
      if (!items.length) { $("hwBox").innerHTML = '<div class="hw-empty"><strong>No homework due.</strong><br>Everything with a due date is turned in.</div>'; return; }
      $("hwBox").innerHTML = `<div class="hw-list">${items.map(i => {
        const cls = i.diff < 0 ? "missing" : i.diff < 86400000 ? "soon" : "";
        const chip = cls === "missing" ? '<span class="chip missing">Missing</span>' : cls === "soon" ? '<span class="chip soon">Due soon</span>' : "";
        return `<a class="hw-card ${cls}" href="${esc(i.link)}" target="_blank" rel="noopener"><span class="hw-stripe"></span><span class="hw-body"><p class="hw-title">${esc(i.title)}</p><p class="hw-course">${esc(i.course)}</p><p class="hw-due">${chip}<span>${esc(dueFmt.format(i.due))} · ${relTime(i.diff)}</span></p></span></a>`;
      }).join("")}</div>`;
    } catch (e) {
      showTodoFallback("Couldn't reach your homework robot");
    } finally { hwLoading = false; }
  }
  setInterval(loadHomework, 120000);


  function render() {
    const now = Date.now();
    let left = Math.max(0, LAST_DAY_END - now);
    if (left === 0) {
      $("days").textContent = "0";
      $("label").textContent = "School's out!";
      $("clock").hidden = true;
    } else {
      const sec = Math.floor(left / 1000);
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      $("days").textContent = d;
      $("label").textContent = d === 1 ? "day left" : "days left";
      const parts = [];
      if (settings.h) parts.push(`${h}<span class="u">h</span>`);
      if (settings.m) parts.push(`${pad(m)}<span class="u">m</span>`);
      if (settings.s) parts.push(`${pad(s)}<span class="u">s</span>`);
      $("clock").hidden = parts.length === 0;
      $("clock").innerHTML = parts.join("");
    }
    const pct = Math.min(100, Math.max(0, ((now - FIRST_DAY) / (LAST_DAY_END - FIRST_DAY)) * 100));
    $("fill").style.width = pct.toFixed(1) + "%";
    $("pct").textContent = Math.floor(pct) + "% done";
  }

  function applyTheme() {
    document.body.dataset.app = settings.theme;
    document.querySelectorAll("[data-theme-pick]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themePick === settings.theme)));
  }

  ["h", "m", "s"].forEach(k => {
    const el = $("opt" + k.toUpperCase());
    el.checked = settings[k];
    el.addEventListener("change", () => { settings[k] = el.checked; save(); render(); });
  });
  document.querySelectorAll("[data-theme-pick]").forEach(b => b.addEventListener("click", () => { settings.theme = b.dataset.themePick; save(); applyTheme(); }));

  function openSheet(open) {
    $("sheet").classList.toggle("open", open);
    $("scrim").classList.toggle("open", open);
    $("gearBtn").classList.toggle("spin", open);
    $("sheet").setAttribute("aria-hidden", String(!open));
  }
  $("gearBtn").addEventListener("click", () => openSheet(true));
  $("closeBtn").addEventListener("click", () => openSheet(false));
  $("scrim").addEventListener("click", () => openSheet(false));

  // Self-update: check the site for a newer version and reload when one is found
  const APP_VERSION = "13";
  async function checkForUpdate() {
    if (!location.hostname.endsWith("github.io")) return;
    try {
      const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
      const text = await res.text();
      const m = text.match(/const APP_VERSION = "([^"]+)"/);
      // Open the new version by its own address so the phone can't show an old saved copy
      const alreadyTried = new URLSearchParams(location.search).get("v") === (m && m[1]);
      if (m && m[1] !== APP_VERSION && !alreadyTried) location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
    } catch (e) {}
  }
  $("ver").textContent = APP_VERSION;
  checkForUpdate();
  setInterval(checkForUpdate, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });

  // Refresh instantly when the app comes back from the background
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); loadHomework(); } });
  window.addEventListener("pageshow", render);
  window.addEventListener("focus", render);

  // Keep settings and the open Settings panel when a new version arrives
  window.claude?.hot?.snapshot?.(() => ({ settings, open: $("sheet").classList.contains("open") }));
  function start(data) {
    if (data && data.settings) {
      settings = { ...defaults, ...data.settings };
      ["h", "m", "s"].forEach(k => { $("opt" + k.toUpperCase()).checked = settings[k]; });
    }
    applyTheme();
    render();
    loadHomework();
    $("hwRefresh").addEventListener("click", loadHomework);
    if (data && data.open) openSheet(true);
    setInterval(render, 1000);
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</html>
